<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  
    <defs>
      <marker id="flecha" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
      </marker>
      <marker id="flecha-azul" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8" />
      </marker>
      <filter id="sombra-suave" x="-4%" y="-4%" width="108%" height="108%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
      </filter>
    </defs>
    
  <rect width="100%" height="100%" fill="#f8fafc" />
  
    <!-- Encabezado Limpio -->
    <rect x="50" y="30" width="1100" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="75" y="58" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Nivel 2: Contenedores del Sistema</text>
    <text x="75" y="80" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" fill="#64748b">JackSoft — Aplicaciones, servidor y base de datos</text>
    

  <!-- USUARIOS ARRIBA -->
  <g transform="translate(140, 120)" filter="url(#sombra-suave)">
    <rect width="250" height="60" rx="8" fill="#0c4a6e" />
    <text x="125" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Cliente y Administrador</text>
    <text x="125" y="44" font-family="sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Acceso desde computador o navegador</text>
  </g>

  <g transform="translate(770, 120)" filter="url(#sombra-suave)">
    <rect width="250" height="60" rx="8" fill="#0c4a6e" />
    <text x="125" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Domiciliario</text>
    <text x="125" y="44" font-family="sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Repartidor en la calle con teléfono móvil</text>
  </g>

  <!-- LÍMITE DE JACKSOFT -->
  <rect x="60" y="210" width="1080" height="520" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,6" />
  <text x="85" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569">Límite del Software: JackSoft</text>

  <!-- CONTENEDOR 1: Aplicación Web -->
  <g transform="translate(130, 260)" filter="url(#sombra-suave)">
    <rect width="270" height="120" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
    <text x="135" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Aplicación Web</text>
    <text x="135" y="52" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">[Frontend para Navegadores]</text>
    <line x1="20" y1="64" x2="250" y2="64" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="85" font-family="sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">Permite pedir suscripciones, elegir menús,</text>
    <text x="135" y="103" font-family="sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">gestionar compras, cocina y ver reportes.</text>
  </g>

  <!-- CONTENEDOR 2: Aplicación Móvil -->
  <g transform="translate(760, 260)" filter="url(#sombra-suave)">
    <rect width="270" height="120" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
    <text x="135" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Aplicación Móvil</text>
    <text x="135" y="52" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">[App para Teléfonos Móviles]</text>
    <line x1="20" y1="64" x2="250" y2="64" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="85" font-family="sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">Muestra las rutas de entrega al repartidor,</text>
    <text x="135" y="103" font-family="sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle">confirma pedidos y registra cocas recogidas.</text>
  </g>

  <!-- CONTENEDOR 3: Servidor Backend (Cerebro) -->
  <g transform="translate(415, 420)" filter="url(#sombra-suave)">
    <rect width="370" height="130" rx="10" fill="#1d4ed8" stroke="#1e40af" stroke-width="2" />
    <text x="185" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Servidor Backend</text>
    <text x="185" y="56" font-family="sans-serif" font-size="12" font-weight="600" fill="#bfdbfe" text-anchor="middle">[Cerebro y Lógica del Sistema]</text>
    <line x1="25" y1="68" x2="345" y2="68" stroke="#3b82f6" stroke-width="1" />
    <text x="185" y="90" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Recibe las peticiones de la web y el móvil.</text>
    <text x="185" y="108" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Aplica el cobro de cocas ($70.000), descuenta festivos</text>
    <text x="185" y="124" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">y organiza las entregas diarias.</text>
  </g>

  <!-- CONTENEDOR 4: Base de Datos Relacional -->
  <g transform="translate(460, 590)" filter="url(#sombra-suave)">
    <rect width="280" height="115" rx="10" fill="#0f766e" stroke="#115e59" stroke-width="2" />
    <ellipse cx="140" cy="18" rx="120" ry="10" fill="#14b8a6" />
    <text x="140" y="44" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Base de Datos</text>
    <text x="140" y="64" font-family="sans-serif" font-size="12" font-weight="600" fill="#ccfbf1" text-anchor="middle">[Almacén de Información]</text>
    <text x="140" y="86" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Guarda usuarios, suscripciones,</text>
    <text x="140" y="102" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">comprobantes, insumos y rutas.</text>
  </g>

  <!-- CONEXIONES -->
  <line x1="265" y1="180" x2="265" y2="260" stroke="#475569" stroke-width="1.8" marker-end="url(#flecha)" />
  <line x1="895" y1="180" x2="895" y2="260" stroke="#475569" stroke-width="1.8" marker-end="url(#flecha)" />

  <!-- App Web a Backend -->
  <line x1="400" y1="340" x2="520" y2="420" stroke="#1d4ed8" stroke-width="2" marker-end="url(#flecha-azul)" />
  <text x="440" y="370" font-family="sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="600">Peticiones web</text>

  <!-- App Móvil a Backend -->
  <line x1="760" y1="340" x2="680" y2="420" stroke="#1d4ed8" stroke-width="2" marker-end="url(#flecha-azul)" />
  <text x="735" y="370" font-family="sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="600">Sincroniza ruta</text>

  <!-- Backend a Base de Datos -->
  <line x1="600" y1="550" x2="600" y2="590" stroke="#0f766e" stroke-width="2.5" marker-end="url(#flecha)" />
  <text x="660" y="575" font-family="sans-serif" font-size="11.5" fill="#0f766e" font-weight="600">Lee y guarda</text>
</svg>
